  <script>
    async function handleCreateLanding() {
        // Simple client-side check if user already has landings
        // In a real app, this should be a robust backend check or checking a cached value
        try {
            const btn = document.querySelector('button[onclick="handleCreateLanding()"]');
            if(btn) {
                btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Verificando...';
                btn.disabled = true;
            }

            const res = await fetch('/api/landings');
            if (res.ok) {
                const landings = await res.json();
                if (landings && landings.length > 0) {
                    // User has landings -> Redirect to Dashboard
                    // alert('Ya tienes una landing creada. Redirigiendo a tus proyectos.');
                    document.querySelector('[data-page="dashboard"]').click();
                } else {
                    // User has NO landings -> Go to Builder
                    window.open('/build.html', '_blank');
                }
            } else {
                // Fallback on error
                window.open('/build.html', '_blank');
            }
        } catch (e) {
            console.error(e);
            window.open('/build.html', '_blank');
        } finally {
             // Reset button state if we are still on the page (didn't redirect)
             const btn = document.querySelector('button[onclick="handleCreateLanding()"]');
             if(btn) {
                btn.innerHTML = '<i data-feather="plus-circle" class="me-2"></i> Crear Nueva Landing';
                btn.disabled = false;
                if(window.feather) feather.replace();
             }
        }
    }
  </script>
