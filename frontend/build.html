<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halcones - Viajes y Cruceros</title>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* --- CORE VARIABLES & RESET --- */
        :root {
            --lp-primary: #2563eb;
            --lp-secondary: #1e293b;
            --lp-accent: #f59e0b;
            --lp-bg: #ffffff;
            --lp-text: #334155;
            --lp-font-main: 'Overpass', sans-serif;
            --lp-font-heading: 'Overpass', sans-serif;
            --lp-spacing: 4rem;
            --lp-radius: 0.5rem;
            --lp-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --lp-container: 1200px;
        }
    
        body {
            margin: 0;
            padding: 0;
            font-family: var(--lp-font-main);
            color: var(--lp-text);
            line-height: 1.6;
            background: var(--lp-bg);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
    
        * {
            box-sizing: border-box;
        }
    
        h1, h2, h3 {
            font-family: var(--lp-font-heading);
            line-height: 1.2;
            margin-bottom: 1rem;
            color: var(--lp-secondary);
            margin-top: 0;
        }
    
        p {
            margin-bottom: 1.5rem;
            margin-top: 0;
        }
    
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    
        .landing-container {
            max-width: var(--lp-container);
            margin: 0 auto;
            padding: 0 1.5rem;
        }
    
        .landing-section {
            padding: var(--lp-spacing) 0;
            position: relative;
        }
    
        .landing-btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: var(--lp-primary);
            color: white;
            text-decoration: none;
            border-radius: var(--lp-radius);
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }
    
        .landing-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--lp-shadow);
            color: white;
        }
    
        .landing-btn.secondary {
            background: transparent;
            border: 2px solid var(--lp-primary);
            color: var(--lp-primary);
        }
    
        /* --- BLOCKS --- */
    
        /* Hero */
        .lp-hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            min-height: 80vh;
        }
        .lp-hero-content h1 {
            font-size: 3.5rem;
            font-weight: 800;
        }
        .lp-hero-content p {
            font-size: 1.25rem;
            color: #64748b;
        }
        .lp-hero-image img {
            border-radius: var(--lp-radius);
            box-shadow: 20px 20px 0 var(--lp-primary);
        }
    
        /* Features */
        .lp-features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .lp-feature-card {
            padding: 2rem;
            border-radius: var(--lp-radius);
            background: #f8fafc;
            transition: transform 0.3s;
        }
        .lp-feature-card:hover {
            transform: translateY(-5px);
            background: white;
            box-shadow: var(--lp-shadow);
        }
        .lp-feature-icon {
            width: 48px;
            height: 48px;
            background: var(--lp-primary);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
    
        /* Testimonials */
        .lp-testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .lp-testimonial-card {
            background: white;
            padding: 2rem;
            border-radius: var(--lp-radius);
            box-shadow: var(--lp-shadow);
            border-left: 4px solid var(--lp-primary);
        }
        .lp-testimonial-author {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .lp-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #cbd5e1;
            object-fit: cover;
        }
    
        /* Pricing */
        .lp-pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            align-items: start;
        }
        .lp-pricing-card {
            background: white;
            padding: 2.5rem;
            border-radius: var(--lp-radius);
            border: 1px solid #e2e8f0;
            text-align: center;
            position: relative;
        }
        .lp-pricing-card.featured {
            border-color: var(--lp-primary);
            box-shadow: 0 10px 25px -5px rgb(37 99 235 / 0.2);
            transform: scale(1.05);
            z-index: 1;
        }
        .lp-price {
            font-size: 3rem;
            font-weight: 800;
            color: var(--lp-secondary);
            margin: 1.5rem 0;
        }
        .lp-price span {
            font-size: 1rem;
            color: #64748b;
            font-weight: 400;
        }
    
        /* Form */
        .lp-form-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 3rem;
            border-radius: var(--lp-radius);
            box-shadow: var(--lp-shadow);
        }
        .lp-form-group {
            margin-bottom: 1.5rem;
        }
        .lp-form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .lp-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: var(--lp-radius);
            font-family: inherit;
        }
        .lp-input:focus {
            outline: none;
            border-color: var(--lp-primary);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }
    
        /* Footer */
        .lp-footer {
            background: var(--lp-secondary);
            color: white;
            padding: 4rem 0;
            text-align: center;
        }
        .lp-footer a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 1rem;
        }
        .lp-footer a:hover {
            color: white;
        }
    
        /* Loader */
        .landing-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            color: var(--lp-primary);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--lp-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    
        /* Mobile */
        @media (max-width: 768px) {
            .lp-hero { grid-template-columns: 1fr; text-align: center; }
            .lp-hero-content h1 { font-size: 2.5rem; }
            .lp-hero-image { order: -1; }
            .lp-pricing-card.featured { transform: none; }
        }

    /* --- BUILDER UI --- */
    body.has-builder-sidebar {
        padding-left: 300px;
        transition: padding-left 0.3s;
    }
    #lp-builder-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 300px;
        height: 100vh;
        background: #1e293b;
        color: white;
        z-index: 9999;
        overflow-y: auto;
        box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        border-right: 1px solid #334155;
    }
    .lp-builder-header {
        padding: 1.5rem;
        background: #0f172a;
        border-bottom: 1px solid #334155;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
    }
    .lp-builder-header h3 {
        color: white;
        margin: 0;
        font-size: 1.25rem;
    }
    .lp-builder-controls {
        padding: 1.5rem;
    }
    .lp-control-group {
        margin-bottom: 2rem;
        background: #334155;
        padding: 1rem;
        border-radius: 0.5rem;
    }
    .lp-control-group h4 {
        color: #94a3b8;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 1rem;
        border-bottom: 1px solid #475569;
        padding-bottom: 0.5rem;
    }
    .lp-control-label {
        display: block;
        font-size: 0.875rem;
        margin-bottom: 0.5rem;
        color: #cbd5e1;
    }
    .lp-control-input {
        width: 100%;
        background: #1e293b;
        border: 1px solid #475569;
        color: white;
        padding: 0.5rem;
        border-radius: 0.25rem;
        margin-bottom: 1rem;
        font-family: inherit;
    }
    .lp-control-input:focus {
        outline: none;
        border-color: #3b82f6;
    }
    .lp-control-textarea {
        width: 100%;
        background: #1e293b;
        border: 1px solid #475569;
        color: white;
        padding: 0.5rem;
        border-radius: 0.25rem;
        margin-bottom: 1rem;
        font-family: inherit;
        resize: vertical;
        min-height: 80px;
    }
    </style>
</head>
<body>

<div id="landing-builder-root" class="landing-wrapper">
    <!-- Dynamic Content Will Be Injected Here -->
    <div class="landing-loader">
        <div class="spinner"></div>
        <p>Cargando experiencia...</p>
    </div>
</div>

<script src="js/builder.js"></script>
<script type="text/deprecated">
/**
 * Landing Page Builder Engine
 * Interprets JSON Schema -> Renders HTML
 */

const LandingBuilder = {
    // Default Theme
    defaults: {
        theme: {
            primary: '#2563eb',
            secondary: '#1e293b',
            font: 'Overpass, sans-serif'
        }
    },

    // Mock Data (Fallback)
    mockSchema: {
        theme: {
            primary: '#4f46e5',
            secondary: '#0f172a',
            font: 'Inter, sans-serif'
        },
        blocks: [
            {
                type: 'hero',
                data: {
                    headline: 'Construye Landing Pages en Minutos',
                    subheadline: 'Una solución potente, flexible y sin código para tus campañas de marketing.',
                    ctaText: 'Empezar',
                    ctaLink: '#features',
                    image: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80'
                }
            },
            {
                type: 'features',
                data: {
                    id: 'features',
                    title: 'Todo lo que necesitas',
                    items: [
                        { icon: 'zap', title: 'Ultrarrápido', text: 'Optimizado para Core Web Vitals y carga instantánea.' },
                        { icon: 'layout', title: 'Diseño Responsive', text: 'Se ve perfecto en móviles, tablets y escritorio.' },
                        { icon: 'lock', title: 'Seguro', text: 'SSL incluido y protección contra ataques.' },
                        { icon: 'box', title: 'Marca Blanca', text: 'Personaliza totalmente la experiencia sin marcas de agua.' },
                        { icon: 'code', title: 'Acceso API', text: 'Integra tus propias herramientas y flujos de trabajo.' }
                    ]
                }
            },


            {
                type: 'footer',
                data: {
                    copyright: '© 2026 In-Pages. Todos los derechos reservados.',
                    links: [
                        { text: 'Términos', url: '#' },
                        { text: 'Privacidad', url: '#' }
                    ]
                }
            }
        ]
    },

    // Block Templates for New Sections
    templates: {
        hero: {
            type: 'hero',
            data: {
                headline: 'Nuevo Hero Section',
                subheadline: 'Describe tu propuesta de valor aquí.',
                ctaText: 'Llamada a la acción',
                ctaLink: '#',
                image: 'https://via.placeholder.com/800x600'
            }
        },
        features: {
            type: 'features',
            data: {
                title: 'Características Principales',
                items: [
                    { icon: 'check', title: 'Característica 1', text: 'Descripción breve.' },
                    { icon: 'check', title: 'Característica 2', text: 'Descripción breve.' },
                    { icon: 'check', title: 'Característica 3', text: 'Descripción breve.' }
                ]
            }
        },
        testimonials: {
            type: 'testimonials',
            data: {
                items: [
                    { quote: 'Increíble servicio, totalmente recomendado.', name: 'Juan Pérez', role: 'CEO, Empresa X' }
                ]
            }
        },
        pricing: {
            type: 'pricing',
            data: {
                title: 'Nuestros Planes',
                plans: [
                    { name: 'Básico', price: '29', features: ['Feature 1', 'Feature 2'], cta: 'Elegir' },
                    { name: 'Pro', price: '59', features: ['Feature 1', 'Feature 2', 'Feature 3'], cta: 'Elegir', featured: true }
                ]
            }
        },
        form: {
            type: 'form',
            data: {
                title: 'Contáctanos',
                submitText: 'Enviar Mensaje',
                fields: [
                    { label: 'Nombre', type: 'text', placeholder: 'Tu nombre' },
                    { label: 'Email', type: 'email', placeholder: 'tu@email.com' }
                ]
            }
        },
        footer: {
            type: 'footer',
            data: {
                copyright: '© 2024 Mi Empresa.',
                links: [{ text: 'Aviso Legal', url: '#' }]
            }
        }
    },

    init(containerId, landingOrSchema = null) {
        const container = document.getElementById(containerId);
        if (!container) return;

        // Use mock schema if none provided (or fetch from API in real app)
        if (landingOrSchema && landingOrSchema.id) {
            this.currentLanding = landingOrSchema;
            // Ensure data is valid, if it's empty string or null, use mock
             if (this.currentLanding.data && Object.keys(this.currentLanding.data).length > 0) {
                 this.currentSchema = this.currentLanding.data;
             } else {
                 this.currentSchema = this.mockSchema;
             }
        } else {
            this.currentLanding = null; // No backend binding
            this.currentSchema = landingOrSchema || this.mockSchema;
        }

        // Apply Theme
        this.applyTheme(this.currentSchema.theme);

        // Render Blocks
        this.renderCanvas(containerId);

        // Render Editor Sidebar
        this.renderEditor(containerId);

        // Initialize Animations (Simple Intersection Observer)
        this.initAnimations();
    },

    renderCanvas(containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // Clear loader
        
        this.currentSchema.blocks.forEach((block, index) => {
            const renderFn = this.renderMap[block.type];
            if (renderFn) {
                const blockHtml = renderFn(block.data);
                const section = document.createElement('div');
                section.className = `landing-section section-${block.type}`;
                section.dataset.blockIndex = index;
                section.innerHTML = blockHtml;
                
                // Add hover effect for selection (optional visual cue)
                section.style.position = 'relative';
                
                container.appendChild(section);
            }
        });

        // Re-initialize Icons
        if (window.feather) feather.replace();
    },

    renderEditor(containerId) {
        let sidebar = document.getElementById('lp-builder-sidebar');
        if (!sidebar) {
            sidebar = document.createElement('div');
            sidebar.id = 'lp-builder-sidebar';
            document.body.appendChild(sidebar);
            document.body.classList.add('has-builder-sidebar');
        }

        const isDemo = !this.currentLanding || !this.currentLanding.id;
        const statusBadge = isDemo 
            ? '<span style="background: #f59e0b; color: black; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; margin-left: 8px;">DEMO</span>' 
            : '<span style="background: #10b981; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; margin-left: 8px;">EN VIVO</span>';

        sidebar.innerHTML = `
            <div class="lp-builder-header">
                <div>
                    <h3 style="display:inline-block">Editor Visual</h3>
                    ${statusBadge}
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 5px;">
                    <button class="landing-btn small" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="LandingBuilder.save()">Guardar</button>
                    ${!isDemo ? `<a href="/pages/${this.currentLanding.slug}" target="_blank" class="landing-btn secondary small" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; color: #fff; border-color: #fff; text-decoration: none;">Ver</a>` : ''}
                </div>
            </div>
            <div class="lp-builder-controls" id="lp-builder-controls"></div>
            <div class="lp-builder-footer" style="padding: 1.5rem; border-top: 1px solid #334155;">
                <h4 style="color: #94a3b8; font-size: 0.875rem; margin-bottom: 1rem;">Agregar Sección</h4>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                    ${Object.keys(this.templates).map(type => `
                        <button class="landing-btn secondary small" style="padding: 0.5rem; font-size: 0.75rem; text-transform: capitalize;" 
                                onclick="LandingBuilder.addBlock('${type}', '${containerId}')">
                            + ${type}
                        </button>
                    `).join('')}
                </div>
            </div>
        `;

        const controlsContainer = sidebar.querySelector('#lp-builder-controls');
        
        // --- SECCIÓN 1: TEMA GLOBAL ---
        const themeGroup = document.createElement('div');
        themeGroup.className = 'lp-control-group';
        themeGroup.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom:1px solid #475569; padding-bottom:0.5rem;">
                <h4 style="margin:0; border:none; padding:0; color:#ffd080;">🎨 ESTILO GLOBAL</h4>
            </div>
        `;
        
        // Color Primario
        const lblPrimary = document.createElement('label');
        lblPrimary.className = 'lp-control-label';
        lblPrimary.innerText = 'Color Primario';
        const inpPrimary = document.createElement('input');
        inpPrimary.type = 'color';
        inpPrimary.className = 'lp-control-input';
        inpPrimary.style.height = '40px';
        inpPrimary.value = this.currentSchema.theme.primary || this.defaults.theme.primary;
        inpPrimary.addEventListener('input', (e) => {
            this.currentSchema.theme.primary = e.target.value;
            this.applyTheme(this.currentSchema.theme);
        });
        themeGroup.appendChild(lblPrimary);
        themeGroup.appendChild(inpPrimary);

        // Color Secundario
        const lblSecondary = document.createElement('label');
        lblSecondary.className = 'lp-control-label';
        lblSecondary.innerText = 'Color Secundario / Fondo Oscuro';
        const inpSecondary = document.createElement('input');
        inpSecondary.type = 'color';
        inpSecondary.className = 'lp-control-input';
        inpSecondary.style.height = '40px';
        inpSecondary.value = this.currentSchema.theme.secondary || this.defaults.theme.secondary;
        inpSecondary.addEventListener('input', (e) => {
            this.currentSchema.theme.secondary = e.target.value;
            this.applyTheme(this.currentSchema.theme);
        });
        themeGroup.appendChild(lblSecondary);
        themeGroup.appendChild(inpSecondary);

         // Fuente
        const lblFont = document.createElement('label');
        lblFont.className = 'lp-control-label';
        lblFont.innerText = 'Fuente Principal';
        const selFont = document.createElement('select');
        selFont.className = 'lp-control-input';
        ['Overpass, sans-serif', 'Inter, sans-serif', 'Arial, sans-serif', 'Georgia, serif', 'Courier New, monospace'].forEach(f => {
            const opt = document.createElement('option');
            opt.value = f;
            opt.innerText = f.split(',')[0];
            if (this.currentSchema.theme.font === f) opt.selected = true;
            selFont.appendChild(opt);
        });
        selFont.addEventListener('change', (e) => {
            this.currentSchema.theme.font = e.target.value;
            this.applyTheme(this.currentSchema.theme);
        });
        themeGroup.appendChild(lblFont);
        themeGroup.appendChild(selFont);

        controlsContainer.appendChild(themeGroup);

        // --- SECCIÓN 2: BLOQUES ---
        this.currentSchema.blocks.forEach((block, index) => {
            const group = document.createElement('div');
            group.className = 'lp-control-group';
            
            // Header with Controls
            const header = document.createElement('div');
            header.style.display = 'flex';
            header.style.justifyContent = 'space-between';
            header.style.alignItems = 'center';
            header.style.marginBottom = '1rem';
            header.style.borderBottom = '1px solid #475569';
            header.style.paddingBottom = '0.5rem';

            const title = document.createElement('h4');
            title.innerText = `${block.type.toUpperCase()}`;
            title.style.margin = '0';
            title.style.border = 'none';
            title.style.padding = '0';

            const actions = document.createElement('div');
            actions.style.display = 'flex';
            actions.style.gap = '0.25rem';

            // Move Up
            if (index > 0) {
                const upBtn = document.createElement('button');
                upBtn.innerHTML = '↑';
                upBtn.className = 'landing-btn secondary small';
                upBtn.style.padding = '0.1rem 0.4rem';
                upBtn.onclick = () => this.moveBlock(index, -1, containerId);
                actions.appendChild(upBtn);
            }

            // Move Down
            if (index < this.currentSchema.blocks.length - 1) {
                const downBtn = document.createElement('button');
                downBtn.innerHTML = '↓';
                downBtn.className = 'landing-btn secondary small';
                downBtn.style.padding = '0.1rem 0.4rem';
                downBtn.onclick = () => this.moveBlock(index, 1, containerId);
                actions.appendChild(downBtn);
            }

            // Delete
            const delBtn = document.createElement('button');
            delBtn.innerHTML = '×';
            delBtn.className = 'landing-btn small';
            delBtn.style.backgroundColor = '#ef4444';
            delBtn.style.padding = '0.1rem 0.4rem';
            delBtn.onclick = () => this.deleteBlock(index, containerId);
            actions.appendChild(delBtn);

            header.appendChild(title);
            header.appendChild(actions);
            group.appendChild(header);

            // Fields
            Object.keys(block.data).forEach(key => {
                const value = block.data[key];
                if (Array.isArray(value) || typeof value === 'object') return; // Skip complex types for now

                const label = document.createElement('label');
                label.className = 'lp-control-label';
                label.innerText = key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase()); // CamelCase to Title Case
                
                let input;
                if (key === 'subheadline' || key === 'text' || (typeof value === 'string' && value.length > 50)) {
                    input = document.createElement('textarea');
                    input.className = 'lp-control-textarea';
                } else {
                    input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'lp-control-input';
                }
                
                input.value = value;
                input.addEventListener('input', (e) => {
                    block.data[key] = e.target.value;
                    this.renderCanvas(containerId);
                });

                group.appendChild(label);
                group.appendChild(input);
            });

            controlsContainer.appendChild(group);
        });
    },

    addBlock(type, containerId) {
        const template = JSON.parse(JSON.stringify(this.templates[type])); // Deep copy
        this.currentSchema.blocks.push(template);
        this.renderCanvas(containerId);
        this.renderEditor(containerId);
        // Scroll to bottom of sidebar
        setTimeout(() => {
            const sidebar = document.getElementById('lp-builder-sidebar');
            sidebar.scrollTop = sidebar.scrollHeight;
        }, 100);
    },

    moveBlock(index, direction, containerId) {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= this.currentSchema.blocks.length) return;
        
        const temp = this.currentSchema.blocks[index];
        this.currentSchema.blocks[index] = this.currentSchema.blocks[newIndex];
        this.currentSchema.blocks[newIndex] = temp;
        
        this.renderCanvas(containerId);
        this.renderEditor(containerId);
    },

    deleteBlock(index, containerId) {
        if (confirm('¿Estás seguro de eliminar esta sección?')) {
            this.currentSchema.blocks.splice(index, 1);
            this.renderCanvas(containerId);
            this.renderEditor(containerId);
        }
    },

    async save() {
        // Double check if we can recover the landing from URL if it's missing but we are not in intended demo mode
        if ((!this.currentLanding || !this.currentLanding.id) && window.location.search.includes('slug=')) {
             alert('Error: No se ha cargado la información de la landing correctamente. Recarga la página.');
             return;
        }

        if (!this.currentLanding || !this.currentLanding.id) {
            console.log('Saving Schema (Demo Mode):', JSON.stringify(this.currentSchema, null, 2));
            alert('Modo Demo: Diseño guardado en consola (no persistido).');
            return;
        }

        const btn = document.querySelector('button[onclick="LandingBuilder.save()"]');
        const originalText = btn ? btn.innerText : 'Guardar';
        if (btn) {
            btn.innerText = 'Guardando...';
            btn.disabled = true;
        }

        try {
            const payload = {
                ...this.currentLanding,
                data: this.currentSchema
            };

            const res = await fetch(`/api/landings/${this.currentLanding.id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const updated = await res.json();
                this.currentLanding = updated;
                alert('¡Diseño guardado exitosamente!');
            } else {
                const err = await res.json().catch(() => ({}));
                alert('Error al guardar: ' + (err.error || 'Desconocido'));
            }
        } catch (error) {
            console.error('Error saving landing:', error);
            alert('Error de conexión al guardar.');
        } finally {
            if (btn) {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    },

    applyTheme(theme) {
        const root = document.documentElement;
        const t = { ...this.defaults.theme, ...theme };
        
        root.style.setProperty('--lp-primary', t.primary);
        root.style.setProperty('--lp-secondary', t.secondary);
        if (t.font) root.style.setProperty('--lp-font-main', t.font);
    },

    renderMap: {
        hero: (data) => `
            <div class="landing-container">
                <div class="lp-hero">
                    <div class="lp-hero-content">
                        <h1>${data.headline}</h1>
                        <p>${data.subheadline}</p>
                        <br>
                        <a href="${data.ctaLink}" class="landing-btn">${data.ctaText}</a>
                    </div>
                    <div class="lp-hero-image">
                        <img src="${data.image}" alt="Hero Image" loading="lazy">
                    </div>
                </div>
            </div>
        `,
        features: (data) => `
            <div class="landing-container" id="${data.id || ''}">
                <div class="text-center mb-5">
                    <h2>${data.title}</h2>
                </div>
                <div class="lp-features-grid">
                    ${data.items.map(item => `
                        <div class="lp-feature-card">
                            <div class="lp-feature-icon">
                                <i data-feather="${item.icon}"></i>
                            </div>
                            <h3>${item.title}</h3>
                            <p>${item.text}</p>
                        </div>
                    `).join('')}
                </div>
            </div>
        `,
        testimonials: (data) => `
            <div class="landing-container">
                <h2 class="text-center mb-5">Lo que dicen nuestros clientes</h2>
                <div class="lp-testimonials-grid">
                    ${data.items.map(item => `
                        <div class="lp-testimonial-card">
                            <p>"${item.quote}"</p>
                            <div class="lp-testimonial-author">
                                <img src="${item.avatar || 'https://via.placeholder.com/50'}" class="lp-avatar" loading="lazy">
                                <div>
                                    <strong>${item.name}</strong><br>
                                    <small>${item.role}</small>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `,
        pricing: (data) => `
            <div class="landing-container" id="${data.id || ''}">
                <div class="text-center mb-5">
                    <h2>${data.title}</h2>
                </div>
                <div class="lp-pricing-grid">
                    ${data.plans.map(plan => `
                        <div class="lp-pricing-card ${plan.featured ? 'featured' : ''}">
                            <h3>${plan.name}</h3>
                            <div class="lp-price">$${plan.price}<span>/mes</span></div>
                            <ul class="list-unstyled mb-4 text-left" style="text-align: left; margin-left: 1rem;">
                                ${plan.features.map(f => `<li class="mb-2"><i data-feather="check" style="width:16px; color:var(--lp-primary)"></i> ${f}</li>`).join('')}
                            </ul>
                            <a href="#" class="landing-btn ${plan.featured ? '' : 'secondary'}" style="width:100%">${plan.cta || 'Seleccionar'}</a>
                        </div>
                    `).join('')}
                </div>
            </div>
        `,
        form: (data) => `
            <div class="landing-container" id="${data.id || ''}">
                <div class="lp-form-wrapper">
                    <h2 class="text-center mb-4">${data.title}</h2>
                    <form onsubmit="event.preventDefault(); alert('Formulario enviado (Demo)');">
                        ${data.fields.map(field => `
                            <div class="lp-form-group">
                                <label>${field.label}</label>
                                <input type="${field.type}" class="lp-input" placeholder="${field.placeholder}" required>
                            </div>
                        `).join('')}
                        <button type="submit" class="landing-btn" style="width:100%">${data.submitText}</button>
                    </form>
                </div>
            </div>
        `,
        footer: (data) => `
            <div class="lp-footer">
                <div class="landing-container">
                    <p>${data.copyright}</p>
                    <div class="mt-3">
                        ${data.links.map(link => `<a href="${link.url}">${link.text}</a>`).join('')}
                    </div>
                </div>
            </div>
        `
    },

    initAnimations() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.landing-section > div').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(20px)';
            el.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
            observer.observe(el);
        });
    }
};

// Expose initLanding globally as requested
window.initLanding = (schema) => LandingBuilder.init('landing-builder-root', schema);

// Initialize when script loads
document.addEventListener('DOMContentLoaded', async () => {
    // Check if we have a slug in URL to fetch real data, otherwise use mock
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');
    let landing = null;

    if (slug) {
        try {
            console.log("Fetching data for slug:", slug);
            const res = await fetch(`/api/landings/editor/${slug}`);
            
            if (res.status === 401) {
                // Redirect if not logged in
                window.location.href = '/login.html';
                return;
            }

            if (res.ok) {
                landing = await res.json();
                console.log("Loaded landing:", landing);
            } else {
                console.error("Error fetching landing:", res.status);
                const err = await res.json().catch(() => ({}));
                alert(`Error cargando landing: ${res.status} - ${err.error || ''}`);
            }
        } catch (e) {
            console.error("Error loading landing data", e);
            alert("Error de conexión al cargar los datos de la landing.");
        }
    } else {
        console.log("No slug provided, entering Demo Mode");
    }

    LandingBuilder.init('landing-builder-root', landing);
});
</script>
</body>
</html>
