<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halcones - Viajes y Cruceros</title>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* --- CORE VARIABLES & RESET --- */
        :root {
            --lp-primary: #2563eb;
            --lp-secondary: #1e293b;
            --lp-accent: #f59e0b;
            --lp-bg: #ffffff;
            --lp-text: #334155;
            --lp-font-main: 'Overpass', sans-serif;
            --lp-font-heading: 'Overpass', sans-serif;
            --lp-spacing: 4rem;
            --lp-radius: 0.5rem;
            --lp-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --lp-container: 1200px;
        }
    
        body {
            margin: 0;
            padding: 0;
            font-family: var(--lp-font-main);
            color: var(--lp-text);
            line-height: 1.6;
            background: var(--lp-bg);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
    
        * {
            box-sizing: border-box;
        }
    
        h1, h2, h3 {
            font-family: var(--lp-font-heading);
            line-height: 1.2;
            margin-bottom: 1rem;
            color: var(--lp-secondary);
            margin-top: 0;
        }
    
        p {
            margin-bottom: 1.5rem;
            margin-top: 0;
        }
    
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    
        .landing-container {
            max-width: var(--lp-container);
            margin: 0 auto;
            padding: 0 1.5rem;
        }
    
        .landing-section {
            padding: var(--lp-spacing) 0;
            position: relative;
        }
    
        .landing-btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: var(--lp-primary);
            color: white;
            text-decoration: none;
            border-radius: var(--lp-radius);
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }
    
        .landing-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--lp-shadow);
            color: white;
        }
    
        .landing-btn.secondary {
            background: transparent;
            border: 2px solid var(--lp-primary);
            color: var(--lp-primary);
        }
    
        /* --- BLOCKS --- */
    
        /* Hero */
        .lp-hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            min-height: 80vh;
        }
        .lp-hero-content h1 {
            font-size: 3.5rem;
            font-weight: 800;
        }
        .lp-hero-content p {
            font-size: 1.25rem;
            color: #64748b;
        }
        .lp-hero-image img {
            border-radius: var(--lp-radius);
            box-shadow: 20px 20px 0 var(--lp-primary);
        }
    
        /* Features */
        .lp-features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .lp-feature-card {
            padding: 2rem;
            border-radius: var(--lp-radius);
            background: #f8fafc;
            transition: transform 0.3s;
        }
        .lp-feature-card:hover {
            transform: translateY(-5px);
            background: white;
            box-shadow: var(--lp-shadow);
        }
        .lp-feature-icon {
            width: 48px;
            height: 48px;
            background: var(--lp-primary);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
    
        /* Testimonials */
        .lp-testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .lp-testimonial-card {
            background: white;
            padding: 2rem;
            border-radius: var(--lp-radius);
            box-shadow: var(--lp-shadow);
            border-left: 4px solid var(--lp-primary);
        }
        .lp-testimonial-author {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .lp-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #cbd5e1;
            object-fit: cover;
        }
    
        /* Pricing */
        .lp-pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            align-items: start;
        }
        .lp-pricing-card {
            background: white;
            padding: 2.5rem;
            border-radius: var(--lp-radius);
            border: 1px solid #e2e8f0;
            text-align: center;
            position: relative;
        }
        .lp-pricing-card.featured {
            border-color: var(--lp-primary);
            box-shadow: 0 10px 25px -5px rgb(37 99 235 / 0.2);
            transform: scale(1.05);
            z-index: 1;
        }
        .lp-price {
            font-size: 3rem;
            font-weight: 800;
            color: var(--lp-secondary);
            margin: 1.5rem 0;
        }
        .lp-price span {
            font-size: 1rem;
            color: #64748b;
            font-weight: 400;
        }
    
        /* Form */
        .lp-form-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 3rem;
            border-radius: var(--lp-radius);
            box-shadow: var(--lp-shadow);
        }
        .lp-form-group {
            margin-bottom: 1.5rem;
        }
        .lp-form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .lp-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: var(--lp-radius);
            font-family: inherit;
        }
        .lp-input:focus {
            outline: none;
            border-color: var(--lp-primary);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }
    
        /* Footer */
        .lp-footer {
            background: var(--lp-secondary);
            color: white;
            padding: 4rem 0;
            text-align: center;
        }
        .lp-footer a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 1rem;
        }
        .lp-footer a:hover {
            color: white;
        }
    
        /* Loader */
        .landing-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            color: var(--lp-primary);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--lp-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    
        /* Mobile */
        @media (max-width: 768px) {
            .lp-hero { grid-template-columns: 1fr; text-align: center; }
            .lp-hero-content h1 { font-size: 2.5rem; }
            .lp-hero-image { order: -1; }
            .lp-pricing-card.featured { transform: none; }
        }

    /* --- BUILDER UI --- */
    body.has-builder-sidebar {
        padding-left: 300px;
        transition: padding-left 0.3s;
    }

    /* Allow collapsing the visual editor */
    body.builder-sidebar-collapsed {
        padding-left: 0;
    }
    body.builder-sidebar-collapsed #lp-builder-sidebar {
        overflow: hidden;
        bottom: auto;
        height: auto;
    }
    body.builder-sidebar-collapsed #lp-builder-controls,
    body.builder-sidebar-collapsed .lp-builder-footer {
        display: none;
    }

    #lp-builder-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 300px;
        bottom: 0;
        height: auto;
        background: #1e293b;
        color: white;
        z-index: 9999;
        overflow-y: auto;
        box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        border-right: 1px solid #334155;
    }

    /* Inline toggle (shown only on mobile) */
    #lp-builder-toggle-btn {
        display: none;
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        line-height: 1;
    }

    @media (max-width: 768px) {
        body.has-builder-sidebar {
            padding-left: 0;
        }
        #lp-builder-sidebar {
            width: 100vw;
            max-width: 100%;
        }
        #lp-builder-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
    }
    .lp-builder-header {
        padding: 1.5rem;
        background: #0f172a;
        border-bottom: 1px solid #334155;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
    }
    .lp-builder-header h3 {
        color: white;
        margin: 0;
        font-size: 1.25rem;
    }
    .lp-builder-controls {
        padding: 1.5rem;
    }
    .lp-control-group {
        margin-bottom: 2rem;
        background: #334155;
        padding: 1rem;
        border-radius: 0.5rem;
    }
    .lp-control-group h4 {
        color: #94a3b8;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 1rem;
        border-bottom: 1px solid #475569;
        padding-bottom: 0.5rem;
    }
    .lp-control-label {
        display: block;
        font-size: 0.875rem;
        margin-bottom: 0.5rem;
        color: #cbd5e1;
    }
    .lp-control-input {
        width: 100%;
        background: #1e293b;
        border: 1px solid #475569;
        color: white;
        padding: 0.5rem;
        border-radius: 0.25rem;
        margin-bottom: 1rem;
        font-family: inherit;
    }
    .lp-control-input:focus {
        outline: none;
        border-color: #3b82f6;
    }
    .lp-control-textarea {
        width: 100%;
        background: #1e293b;
        border: 1px solid #475569;
        color: white;
        padding: 0.5rem;
        border-radius: 0.25rem;
        margin-bottom: 1rem;
        font-family: inherit;
        resize: vertical;
        min-height: 80px;
    }
    </style>
</head>
<body>

<div id="landing-builder-root" class="landing-wrapper">
    <!-- Dynamic Content Will Be Injected Here -->
    <div class="landing-loader">
        <div class="spinner"></div>
        <p>Cargando experiencia...</p>
    </div>
</div>

<script src="js/builder.js?v=20260109-2"></script>
</body>
</html>
